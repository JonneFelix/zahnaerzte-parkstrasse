name: Deploy to Production (Andre Hotzler)

# Bei Push auf main deployen; von Hand auch als Probelauf ohne Änderungen
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Nur Plan anzeigen, nichts ändern
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy via FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Bun installieren
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Seite bauen
        run: bun run build

      # Kein PHP mehr auf dem Server: Das Skript spiegelt out/ per FTPS und bricht ab,
      # wenn die PHP-Sperre in der .htaccess fehlt.
      - name: Per FTPS deployen
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASS }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python3 -u scripts/deploy-ftps.py out $DRY_RUN
